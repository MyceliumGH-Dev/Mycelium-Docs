site_name: Mycelium Component Documentation
site_description: Component Documentation
site_url: https://mycelium-gh-docs.netlify.app
repo_url: https://github.com/MyceliumGH-Dev/Mycelium-Docs
edit_uri: blob/dev/docs/
site_author: Patrick Kastner
copyright: >-
  Copyright &copy; 2026 Mycelium
extra_css:
  - stylesheets/extra.css
extra:
  # RELEASE COUPLING: bump on every plugin release.
  latest_mycelium_version: "0.1.0.4"

# The Components block below is regenerated by tools/export_components.py, which
# writes docs/components_nav.yml. Paste that file's contents over the block when
# the component set changes; patch_nav.py re-adds the icon markup if it is lost.
nav:
  - Documentation:
      - Start: index.md
  - First Steps: first_steps.md
  - Components:
      - "Overview": Components.md
      - "Massing":
          - "Overview": categories/Massing.md
          - "<img src='/images/icons/Massing_Generator.png' class='nav-gh-icon' /> Massing Generator": components/Massing_Generator.md
      - "Building Types":
          - "Overview": categories/Building_Types.md
          - "<img src='/images/icons/Courtyard_Config.png' class='nav-gh-icon' /> Courtyard Config": components/Courtyard_Config.md
          - "<img src='/images/icons/Linear_Config.png' class='nav-gh-icon' /> Linear Config": components/Linear_Config.md
          - "<img src='/images/icons/Point_Config.png' class='nav-gh-icon' /> Point Config": components/Point_Config.md
          - "<img src='/images/icons/L-Shape_Config.png' class='nav-gh-icon' /> L-Shape Config": components/L-Shape_Config.md
          - "<img src='/images/icons/U-Shape_Config.png' class='nav-gh-icon' /> U-Shape Config": components/U-Shape_Config.md
          - "<img src='/images/icons/Tall_Building_Config.png' class='nav-gh-icon' /> Tall Building Config": components/Tall_Building_Config.md
      - "Vegetation":
          - "Overview": categories/Vegetation.md
          - "<img src='/images/icons/Tree_Config.png' class='nav-gh-icon' /> Tree Config": components/Tree_Config.md
      - "Site":
          - "Overview": categories/Site.md
          - "<img src='/images/icons/Terrain_Generator.png' class='nav-gh-icon' /> Terrain Generator": components/Terrain_Generator.md
      - "Utilities":
          - "Overview": categories/Utilities.md
          - "<img src='/images/icons/Mycelium_Templates.png' class='nav-gh-icon' /> Mycelium Templates": components/Mycelium_Templates.md

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/cd/favicon.svg
  favicon: assets/cd/favicon.svg
  features:
    - tabs
    - instant
    - navigation.tabs
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tooltips
    - navigation.expand
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.prune
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.path
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    - toc.integrate
    - announce.dismiss

  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/toggle-switch-off
        name: Switch to system preference

markdown_extensions:
  - md_in_html
  - markdown_include.include:
      base_path: docs
  - attr_list
  - admonition
  - meta
  - def_list
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.magiclink:
      social_url_shorthand: true   # @user -> https://github.com/user

plugins:
  - glightbox:
      skip_classes:
        - skip-lightbox
        - nav-gh-icon
        - gh-component-selected
  - git-revision-date-localized:
      type: timeago
      custom_format: "%d. %B %Y"
      timezone: US/Eastern
      locale: en
      # Netlify build env doesn't support multiprocessing semaphores.
      enable_parallel_processing: false
      fallback_to_build_date: true
      enable_creation_date: true
      exclude:
        - index.md
      enabled: true
      strict: false
  - tags
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      htmlmin_opts:
        remove_comments: true
  - git-authors:
      show_contribution: true
      show_line_count: true
      show_email_address: false
      count_empty_lines: false
      fallback_to_empty: true
      sort_authors_by: name
      authorship_threshold_percent: 1
      exclude:
        - index.md
      enabled: true
      enabled_on_serve: false
      strict: false
  - search
  - title-casing
