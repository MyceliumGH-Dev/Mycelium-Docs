name: deploy

# Publishes to both targets from one place:
#   - Netlify (https://mycelium-gh-docs.netlify.app) — the canonical URL
#   - GitHub Pages (gh-pages) — mirror, and note that generated component pages use
#     root-absolute asset paths, so the mirror renders without icons or screenshots until
#     a custom domain puts the site at a domain root. See README.md.
#
# Netlify is deployed from here rather than through Netlify's own git integration: that
# integration installs a repo deploy key, and `netlify init` gets 404 on
# POST /repos/MyceliumGH-Dev/.../keys because the Netlify OAuth app is not approved for the
# MyceliumGH-Dev org (GitHub answers 404 rather than 403 for unauthorized apps). Deploying
# with a token sidesteps org OAuth policy entirely and keeps one build path.
#
# Secret required: NETLIFY_AUTH_TOKEN (Netlify user settings -> Applications -> Personal
# access tokens). Without it the Netlify step is skipped and only the gh-pages mirror
# updates — a missing secret must not fail the publish.

on:
  push:
    branches: [main, master]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements.txt"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NETLIFY_SITE_ID: eeda2068-9057-4b40-a13a-e40ccf789eee
      # A step's own env is not dependably readable from that step's `if`, so the
      # secret-present test is hoisted to the job.
      HAS_NETLIFY: ${{ secrets.NETLIFY_AUTH_TOKEN != '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          # git-revision-date-localized and git-authors read the full history.
          fetch-depth: '0'

      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV

      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build
        run: mkdocs build --clean --strict

      - name: Deploy to Netlify (production)
        if: github.event_name != 'pull_request' && env.HAS_NETLIFY == 'true'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: npx --yes netlify-cli deploy --prod --no-build --dir=site --site "$NETLIFY_SITE_ID"

      - name: Deploy to Netlify (preview)
        if: github.event_name == 'pull_request' && env.HAS_NETLIFY == 'true'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: npx --yes netlify-cli deploy --no-build --dir=site --site "$NETLIFY_SITE_ID"

      - name: Warn when the Netlify token is missing
        if: env.HAS_NETLIFY != 'true'
        run: echo "::warning::NETLIFY_AUTH_TOKEN is not set — skipped the Netlify deploy. Only the gh-pages mirror was updated."

      - name: Deploy to GitHub Pages (mirror)
        if: github.event_name != 'pull_request'
        run: mkdocs gh-deploy --force
